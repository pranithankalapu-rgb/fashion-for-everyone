name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fashion_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node.js-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/fashion_db?schema=public"

      - name: Run Backend Integration & E2E Test Suite
        run: |
          npm run dev:backend &
          sleep 5
          npx tsx backend/test_production_upgrade_e2e.ts
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/fashion_db?schema=public"
          JWT_SECRET: "ci-secret-jwt-key"
          PORT: 5000
