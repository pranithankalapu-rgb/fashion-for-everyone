services:
  - type: web
    name: fashion-for-everyone-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fashion-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@fashionforeveryone.com
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: adminpassword123

databases:
  - name: fashion-postgres
    databaseName: fashion_db
    user: fashion_user
    plan: free
